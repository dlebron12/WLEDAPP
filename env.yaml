# Tool and dependency versions for WLED App.
# Exact versions are enforced by: .nvmrc (Node), package.json "engines"
# (Node/npm), and package-lock.json (all npm packages).

runtime:
  node: "22.23.4"
  npm: "10.9.9"

dependencies:
  express: "4.22.3"         # web server and API
  better-sqlite3: "13.0.3"  # SQLite database driver

database:
  engine: sqlite
  file: data/wledapp.db     # created automatically on first run
